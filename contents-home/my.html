<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFFFFF">
  <title>MY - 잡코리아</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
  <style>
    :root {
      --g900:#222; --g800:#444; --g700:#666; --g600:#888; --g500:#999;
      --g400:#BBB; --g300:#D1D1D1; --g200:#E8E8E8; --g100:#F4F4F4; --g50:#F7F7F7;
      --white:#FFF; --black:#000;
      --blue:#1B55F6; --blue-soft:#EEF3FF;
      /* JAMS 2.0 tokens */
      --color-red-50:#FBF5F5;
      --color-red-400:#F37676;
      --color-red-500:#FC3B3B;
      --color-text-secondary:#3E434B;
      --color-text-quaternary:#949BA8;
      --red-up:var(--color-red-500); --blue-down:#2D7BFF;
      --pop-bg:var(--color-red-50);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bot:env(safe-area-inset-bottom,0px);
      --pad:16px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;background:#000}
    body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,sans-serif;color:var(--g900);background:#000;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
    a{text-decoration:none;color:inherit}
    button{border:none;background:none;font:inherit;cursor:pointer;color:inherit}
    img{display:block;max-width:100%}

    .app{max-width:480px;margin:0 auto;position:relative;min-height:100dvh;background:#fff;padding-bottom:calc(56px + var(--safe-bot))}

    /* ===== Status Bar (mock) ===== */
    .status{height:calc(44px + var(--safe-top));padding-top:var(--safe-top);display:flex;align-items:center;justify-content:space-between;padding-left:20px;padding-right:20px;font-size:15px;font-weight:600;color:var(--g900)}
    .status-right{display:flex;align-items:center;gap:6px;font-size:14px}
    .status-right svg{width:18px;height:12px}

    /* ===== Header ===== */
    .hdr{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad)}
    .hdr-title{font-size:20px;font-weight:700;letter-spacing:-.02em}
    .hdr-icons{display:flex;gap:12px;align-items:center}
    .hdr-icons button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--g800)}
    .hdr-icons svg{width:24px;height:24px;display:block}

    /* ===== AD ===== */
    .ad{margin:0 var(--pad);height:60px;background:var(--g100);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--g500);font-weight:500}

    /* ===== 이력서 작성 배너 ===== */
    .resume-banner{display:flex;align-items:center;justify-content:space-between;margin:20px var(--pad) 0;padding:14px 16px;background:var(--blue-soft);border-radius:10px}
    .resume-banner-txt{font-size:14px;color:var(--g800);display:flex;align-items:center;gap:8px}
    .resume-banner-txt strong{color:var(--blue);font-weight:700}
    .resume-banner-txt .dot{display:inline-block;width:1px;height:10px;background:var(--g300)}
    .resume-banner svg{width:20px;height:20px;color:var(--g400)}

    /* ===== Profile ===== */
    .profile{padding:24px var(--pad) 16px}
    .profile-name{font-size:22px;font-weight:700;line-height:1.35;letter-spacing:-.02em}
    .profile-name strong{font-weight:700}
    .profile-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
    .profile-link{flex-shrink:0;font-size:14px;color:var(--g700);text-decoration:underline;text-underline-offset:3px;padding-bottom:4px}

    /* Career card */
    .career-card{margin-top:14px;padding:16px;background:var(--g50);border-radius:10px}
    .career-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .career-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px}
    .career-title svg{width:14px;height:14px;color:var(--g500)}
    .career-chip{font-size:11px;color:var(--g600);padding:3px 8px;background:#fff;border:1px solid var(--g200);border-radius:4px}
    .career-company{font-size:14px;color:var(--g800);font-weight:600;margin-bottom:2px}
    .career-meta{font-size:13px;color:var(--g600)}
    .career-meta .sep{display:inline-block;width:1px;height:10px;background:var(--g300);margin:0 8px;vertical-align:middle}

    /* Skill / Preference toggles */
    .pref-block{padding:14px 0 4px}
    .pref-row{display:flex;align-items:center;gap:6px;padding:6px var(--pad)}
    .pref-label{flex-shrink:0;width:62px;font-size:13px;color:var(--g700);font-weight:500}
    .pref-chips{flex:1;display:flex;gap:6px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
    .pref-chips::-webkit-scrollbar{display:none}
    .chip-toggle{flex-shrink:0;padding:6px 12px;font-size:13px;font-weight:600;border-radius:6px;background:var(--blue-soft);color:var(--blue);border:1px solid #DAE5FF}
    .chip-toggle.muted{background:#fff;color:var(--g700);border-color:var(--g200);font-weight:500}
    .pref-action{flex-shrink:0;width:24px;height:24px;color:var(--g400);display:flex;align-items:center;justify-content:center}
    .pref-action svg{width:20px;height:20px}

    /* ===== 🔥 실시간 인기 콘텐츠 (Rolling) — JAMS 2.0 ===== */
    /* Section = 16(pad)+16(header)+6(gap)+CARD+16(pad). CARD = 48px (24 line-height + 12*2 padding) */
    .pop-roll{margin:14px 0 0;padding:16px;background:var(--pop-bg);display:flex;flex-direction:column;align-items:flex-start;gap:6px}
    .pop-roll-hd{display:flex;align-items:center;gap:4px;height:16px}
    .pop-roll-fire{width:14px;height:14px;display:block;flex-shrink:0}
    .pop-roll-title{font-size:12px;font-weight:600;line-height:16px;color:var(--color-red-400);letter-spacing:0}

    .pop-roll-view{position:relative;width:100%;height:48px;background:#fff;border-radius:8px;overflow:hidden}
    /* 부드러운 롤링: 살짝 더 긴 0.75s + ease-in-out cubic + 자식 fade */
    .pop-roll-track{position:absolute;inset:0;will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;transition:transform .75s cubic-bezier(.65,0,.35,1)}
    .pop-roll-track.no-anim{transition:none}
    .pop-roll-item{position:relative;display:flex;align-items:center;gap:8px;height:48px;padding:14px 16px;cursor:pointer;opacity:.4;transition:opacity .75s cubic-bezier(.65,0,.35,1)}
    .pop-roll-item.is-active{opacity:1}
    .pop-roll-rank{flex-shrink:0;width:8px;font-size:14px;font-weight:500;color:var(--color-text-quaternary);text-align:center;line-height:20px;font-variant-numeric:tabular-nums}
    .pop-roll-text{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:20px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}
    .pop-roll-ind{flex-shrink:0;height:20px;display:flex;align-items:center;justify-content:center}
    .pop-roll-ind img{display:block;width:16px;height:16px}
    .pop-roll-ind.new{font-size:11px;font-weight:600;line-height:20px;color:var(--color-red-400);letter-spacing:.02em}

    /* ===== Icon Grid ===== */
    .menu-grid{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 0 0}
    .menu-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0;color:var(--g800);font-size:13px;font-weight:500}
    .menu-item svg{width:28px;height:28px;color:var(--g800);stroke-width:1.6}

    /* ===== Bottom Nav ===== */
    .bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--g200);display:flex;padding-bottom:var(--safe-bot);z-index:100}
    .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:500;color:var(--g400);transition:color .15s}
    .bnav-item.on{color:var(--g900)}
    .bnav-item svg{width:24px;height:24px;display:block;color:inherit}

    /* Home indicator */
    .home-indicator{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);width:140px;height:4px;background:#000;border-radius:2px;opacity:.85;z-index:101;pointer-events:none}
  </style>
</head>

<div class="home-indicator"></div>

<script>
(function(){
'use strict';

/* ===== Rolling popular articles data =====
   trend: 'up' | 'same' | 'down' | 'new'
   policy:
     - 변동 없거나 높아지면 빨간색 ▲ (up, same)
     - 낮아지면 파란색 ▼ (down)
     - 신규 진입 시 "NEW" 텍스트 배지 (new)
*/
var rollData = [
  {rank: 1,  title: '구글부터 컬리까지, 확산되는 AI 활용 코딩 테스트', trend: 'up',   url: 'article.html'},
  {rank: 2,  title: 'HR 팀장들의 솔직한 위기의 순간들',                  trend: 'new',  url: 'article.html'},
  {rank: 3,  title: "AI 엔지니어가 말하는 '성장하는 개발자'의 조건",      trend: 'down', url: 'article.html'},
  {rank: 4,  title: '햄버거 맛은 기본, 성장에도 진심인 맥도날드',        trend: 'up',   url: 'article.html'},
  {rank: 5,  title: '개발자 번아웃, 어떻게 극복할 수 있을까?',           trend: 'down', url: 'article.html'},
  {rank: 6,  title: '스타트업 vs 대기업, 나에게 맞는 선택은?',           trend: 'new',  url: 'article.html'},
  {rank: 7,  title: '재택근무 3년차가 알려주는 생산성 유지법',           trend: 'same', url: 'article.html'},
  {rank: 8,  title: '직장인 자기계발, 퇴근 후 1시간의 힘',              trend: 'down', url: 'article.html'},
  {rank: 9,  title: '회사에서 인정받는 보고서 작성의 기술',             trend: 'up',   url: 'article.html'},
  {rank: 10, title: '연봉 협상에서 절대 하지 말아야 할 실수',            trend: 'down', url: 'article.html'}
];

var ITEM_H = 48;       // px — must match .pop-roll-item height
var ROLL_MS = 3000;    // 3-second auto-roll

var track = document.getElementById('popRollTrack');
var view  = document.getElementById('popRollView');

function indHtml(trend){
  if (trend === 'new') {
    return '<span class="pop-roll-ind new" aria-label="신규 진입">NEW</span>';
  }
  if (trend === 'down') {
    return '<span class="pop-roll-ind down"><img src="my_svg/down.svg" alt="순위 하락"></span>';
  }
  // up & same → red up triangle (per policy)
  var label = (trend === 'same') ? '순위 변동 없음' : '순위 상승';
  return '<span class="pop-roll-ind ' + trend + '"><img src="my_svg/up.svg" alt="' + label + '"></span>';
}

function itemHtml(d){
  return '<a class="pop-roll-item" href="' + d.url + '">'
       + '<span class="pop-roll-rank">' + d.rank + '</span>'
       + '<span class="pop-roll-text">' + d.title + '</span>'
       + indHtml(d.trend)
       + '</a>';
}

// Render all 10 items + clone the first for seamless loop
var html = rollData.map(itemHtml).join('') + itemHtml(rollData[0]);
track.innerHTML = html;

var items = track.querySelectorAll('.pop-roll-item');
var idx = 0;
var timer = null;
var paused = false;
var animating = false;

function setActive(i){
  items.forEach(function(el, j){ el.classList.toggle('is-active', j === i); });
}

setActive(0);

function tick(){
  if (paused || animating) return;
  animating = true;
  idx += 1;
  track.style.transform = 'translate3d(0,' + (-idx * ITEM_H) + 'px,0)';
  // 다음 아이템이 활성 상태로 페이드인
  setActive(idx);

  if (idx === rollData.length){
    // 트랜지션이 끝난 직후 클론 → 원본으로 무애니메이션 점프
    setTimeout(function(){
      track.classList.add('no-anim');
      idx = 0;
      track.style.transform = 'translate3d(0,0,0)';
      setActive(0);
      void track.offsetHeight; // reflow
      track.classList.remove('no-anim');
      animating = false;
    }, 760);
  } else {
    setTimeout(function(){ animating = false; }, 760);
  }
}

function start(){ stop(); timer = setInterval(tick, ROLL_MS); }
function stop(){ if (timer){ clearInterval(timer); timer = null; } }

// Pause when user touches/hovers the banner so they can read it
view.addEventListener('mouseenter', function(){ paused = true; });
view.addEventListener('mouseleave', function(){ paused = false; });
view.addEventListener('touchstart', function(){ paused = true; }, {passive:true});
view.addEventListener('touchend',   function(){ paused = false; }, {passive:true});

// Pause when the tab is hidden
document.addEventListener('visibilitychange', function(){
  if (document.hidden) stop(); else start();
});

start();
})();
</script>
