<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>알바몬 - 온보딩 (탐색구조 Track)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261022">
</head>
<body>

<div class="page-bg">
<div class="phone" data-screen="login">

  <!-- iPhone-status-bar(upper) · 모바일에서는 숨김 -->
  <div class="statusbar-wrap">
    <div class="statusbar">
      <div class="status-time"><img src="assets/status-time.svg" width="33" height="15" alt=""></div>
      <img class="status-indicator" src="assets/status-indicator.svg" width="6" height="6" alt="">
      <div class="status-icons">
        <img src="assets/status-network.svg" width="20" height="14" alt="">
        <img src="assets/status-wifi.svg" width="16" height="14" alt="">
        <img src="assets/status-battery.svg" width="25" height="14" alt="">
      </div>
    </div>
  </div>

  <div class="screens">

    <!-- ============ 로그인 (4389:66019) ============ -->
    <section class="screen login" data-screen="login" aria-label="로그인">
      <div class="login-scroll">
        <div class="mobile-header">
          <button class="btn-close" type="button" data-go="step1" aria-label="닫기">
            <img src="assets/icon-close-24.svg" width="24" height="24" alt="">
          </button>
        </div>

        <div class="featurecard">
          <p class="featurecard-title">가장 많은 공고와<br>인재를 만날 수 있어요</p>

          <div class="intro-img" aria-hidden="true">
            <div class="mock-phone">
              <div class="mock-inner">
                <div class="mock-header">
                  <img src="assets/login-albamon-logo.svg" width="64.4443" height="11.521" alt="">
                  <div class="mock-icons">
                    <div class="mock-icon"><div class="mock-icon-box"><img class="ic-search" src="assets/login-mock-search.svg" width="11.0524" height="10.5635" alt=""></div></div>
                    <div class="mock-icon"><div class="mock-icon-box"><img class="ic-menu" src="assets/login-mock-menu.svg" width="10.6944" height="8.25" alt=""></div></div>
                  </div>
                </div>
                <div class="mock-blocks"><span></span><span></span><span></span><span></span></div>
              </div>
            </div>

            <div class="stat-card stat-card-jobs">
              <div class="stat-icon">
                <img class="bg" src="assets/login-circle-blue.svg" width="48" height="48" alt="">
                <img class="doc-back" src="assets/login-doc-back.svg" width="16.2" height="19.5772" alt="">
                <img class="doc-front" src="assets/login-doc-front.svg" width="18" height="22.1268" alt="">
                <span class="doc-bar doc-bar-1"></span>
                <span class="doc-bar doc-bar-2"></span>
                <img class="doc-badge" src="assets/login-doc-badge.svg" width="6.28598" height="7.60908" alt="">
              </div>
              <div class="stat-text">
                <p class="stat-label">매월 신규 공고</p>
                <p class="stat-value">52만 건↑</p>
              </div>
            </div>

            <div class="stat-card stat-card-members">
              <div class="stat-icon">
                <img class="bg" src="assets/login-circle-orange.svg" width="48" height="48" alt="">
                <span class="card-back"></span>
                <span class="card-mid"></span>
                <span class="card-front">
                  <span class="paper"></span>
                  <span class="line line-1"></span>
                  <span class="line line-2"></span>
                  <span class="line line-3"></span>
                  <span class="avatar"><img src="assets/login-member-avatar.svg" width="18.8484" height="14.7851" alt=""></span>
                </span>
              </div>
              <div class="stat-text">
                <p class="stat-label">누적 회원 수</p>
                <p class="stat-value">1800만 명↑</p>
              </div>
            </div>

            <p class="intro-caption">2025년 기준</p>
          </div>
        </div>

        <div class="pager" aria-hidden="true"><span class="is-active"></span><span></span><span></span><span></span></div>

        <div class="login-actions">
          <div class="sns-list">
            <button class="sns-btn is-kakao" type="button" data-go="step1">
              <span class="sns-icon"><img class="kakao" src="assets/sns-kakao.svg" width="13.1724" height="13.1724" alt=""></span>카카오로 계속하기
            </button>
            <button class="sns-btn" type="button" data-go="step1">
              <span class="sns-icon"><img class="full" src="assets/sns-naver.svg" width="16" height="16" alt=""></span>네이버로 계속하기
            </button>
            <button class="sns-btn" type="button" data-go="step1">
              <span class="sns-icon"><img class="google" src="assets/sns-google.svg" width="12.0019" height="12.2478" alt=""></span>구글로 계속하기
            </button>
            <button class="sns-btn" type="button" data-go="step1">
              <span class="sns-icon"><img class="apple" src="assets/sns-apple.svg" width="10.6673" height="13.5107" alt=""></span>애플로 계속하기
            </button>
            <button class="sns-btn" type="button" data-go="step1">
              <span class="sns-icon"><img class="full" src="assets/sns-facebook.svg" width="16" height="16" alt=""></span>페이스북으로 계속하기
            </button>
          </div>
          <div class="login-links">
            <button class="link-id" type="button">아이디 로그인/회원가입</button>
            <span class="separator" aria-hidden="true"></span>
            <button class="link-biz" type="button">기업회원 로그인/회원가입</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ STEP 1 · 지역 선택 (4389:66043 외) ============ -->
    <section class="screen step1" data-screen="step1" aria-label="지역 선택" hidden>
      <div class="stepper" aria-label="3단계 중 1단계"><div class="stepper-track"><span class="is-done"></span><span></span><span></span></div></div>
      <div class="title-block"><h1 class="title">어디서 일하고 싶으세요?</h1></div>

      <div class="search-row">
        <div class="search-field" id="search-field">
          <input class="search-input" id="region-search" type="search" placeholder="지역명으로 검색" autocomplete="off" enterkeyhint="search" aria-label="지역명으로 검색">
          <span class="search-icons">
            <button class="search-clear" id="search-clear" type="button" aria-label="검색어 지우기" hidden>
              <img src="assets/icon-circle-close-fill.svg" width="24" height="24" alt="">
            </button>
            <img src="assets/icon-search.svg" width="24" height="24" alt="">
          </span>
        </div>

        <button class="remote-check" id="remote-check" type="button" role="checkbox" aria-checked="false">
          <span class="checkbox"><img src="assets/icon-checkbox-check.svg" width="20" height="20" alt=""></span>
          <span class="remote-label">재택 포함</span>
        </button>
      </div>

      <div class="region-body">
        <div class="region-cols" id="region-cols">
          <div class="region-col" id="depth1" role="listbox" aria-label="시·도"></div>
          <div class="region-col" id="depth2" aria-label="시·군·구"></div>
        </div>
        <div class="search-results" id="search-results" aria-label="검색 결과" hidden></div>
      </div>

      <div class="step1-bottom">
        <div class="bottom-bar" id="step1-bar">
          <button class="btn btn-primary" type="button" disabled>다음</button>
        </div>

        <div class="select-sheet" id="select-sheet" hidden>
          <div class="sheet-head">
            <p class="sheet-count"><span class="label">선택한 곳</span><span class="num"><span id="select-count">0</span><span class="max">/10</span></span></p>
            <button class="btn-reset" id="select-reset" type="button">
              <img src="assets/icon-redo.svg" width="16" height="16" alt="">초기화
            </button>
          </div>
          <div class="chip-row" id="chip-row"></div>
          <div class="bottom-bar">
            <button class="btn btn-primary" type="button" data-go="step2">다음</button>
          </div>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite">
          <img src="assets/icon-warning.svg" width="16" height="16" alt="">
          <span>최대 10개까지 선택할 수 있어요</span>
        </div>
      </div>

      <!-- 검색 시 키보드 목업 (PC 전용) -->
      <div class="keyboard" aria-hidden="true">
        <img src="assets/keyboard.png" width="390" height="332" alt="">
        <button class="keyboard-done" id="keyboard-done" type="button" tabindex="-1" aria-label="완료"></button>
      </div>
    </section>

    <!-- ============ STEP 2 · 근무기간 선택 (4389:71936 / 4433:74682) ============ -->
    <section class="screen step2" data-screen="step2" aria-label="근무기간 선택" hidden>
      <div class="stepper" aria-label="3단계 중 2단계"><div class="stepper-track"><span class="is-done"></span><span class="is-done"></span><span></span></div></div>
      <div class="content-scroll">
        <div class="title-block"><h1 class="title">얼마나 일하고 싶으세요?</h1></div>
        <div class="period-list" id="period-list">
          <button class="btn option-btn" type="button" data-period="within-month" aria-pressed="false">한 달 이내<img src="assets/icon-check-brand.svg" width="20" height="20" alt=""></button>
          <button class="btn option-btn" type="button" data-period="over-month" aria-pressed="false">한 달 이상<img src="assets/icon-check-brand.svg" width="20" height="20" alt=""></button>
          <button class="btn option-btn" type="button" data-period="any" aria-pressed="false">상관 없어요<img src="assets/icon-check-brand.svg" width="20" height="20" alt=""></button>
        </div>
      </div>
      <div class="bottom-bar">
        <button class="btn btn-secondary" type="button" data-go="step1">이전</button>
        <button class="btn btn-primary" id="step2-next" type="button" data-go="step3" hidden>다음</button>
      </div>
    </section>

    <!-- ============ STEP 3 · 업직종 선택 (4488:78079 / 4488:78228) ============ -->
    <section class="screen step3" data-screen="step3" aria-label="업직종 선택" hidden>
      <div class="stepper" aria-label="3단계 중 3단계"><div class="stepper-track"><span class="is-done"></span><span class="is-done"></span><span class="is-done"></span></div></div>
      <div class="content-scroll">
        <div class="title-block">
          <h1 class="title">어떤 일을 하고 싶으세요?</h1>
          <p class="subtitle"><strong>복수 선택</strong>이 가능해요</p>
        </div>
        <div class="job-grid" id="job-grid"></div>
      </div>
      <div class="bottom-bar">
        <button class="btn btn-secondary" type="button" data-go="step2">이전</button>
        <button class="btn btn-primary" id="step3-next" type="button" disabled>공고 보기</button>
      </div>
    </section>

  </div>
</div>
</div>

<script src="app.js?v=20261022"></script>
</body>
</html>
