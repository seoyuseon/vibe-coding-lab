<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온보딩 UT 결과</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
/* ============ 토큰 (라이트 · 다크) ============ */
:root{
  color-scheme:light;
  --page:#f4f5f7;
  --surface:#ffffff;
  --surface-2:#f6f7f8;
  --ink:#131618;
  --ink-2:#4a5158;
  --muted:#7d868e;
  --grid:#e6e8ea;
  --axis:#c9ced3;
  --border:rgba(19,22,24,.08);
  --series-a:#2a78d6;     /* A 코치마크 · 범주 1 */
  --series-b:#eb6834;     /* B 하이라이트 · 범주 2 */
  --bar:#2a78d6;          /* 단일 계열 */
  --bar-hover:#256abf;
  --good:#0ca30c;
  --critical:#d03b3b;
  --accent:#ff6d12;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0f1112;
    --surface:#1a1c1e;
    --surface-2:#222528;
    --ink:#f0f1f2;
    --ink-2:#c3c8cd;
    --muted:#8d959c;
    --grid:#2c2f32;
    --axis:#3a3e42;
    --border:rgba(255,255,255,.08);
    --series-a:#3987e5;
    --series-b:#d95926;
    --bar:#3987e5;
    --bar-hover:#5598e7;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0f1112;
  --surface:#1a1c1e;
  --surface-2:#222528;
  --ink:#f0f1f2;
  --ink-2:#c3c8cd;
  --muted:#8d959c;
  --grid:#2c2f32;
  --axis:#3a3e42;
  --border:rgba(255,255,255,.08);
  --series-a:#3987e5;
  --series-b:#d95926;
  --bar:#3987e5;
  --bar-hover:#5598e7;
}

*{box-sizing:border-box;}
html,body{margin:0;}
body{
  background:var(--page);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;
  line-height:20px;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit; color:inherit;}
button{cursor:pointer;}
h1,h2,h3,p{margin:0;}
.wrap{max-width:1180px; margin:0 auto; padding:32px 24px 64px; display:flex; flex-direction:column; gap:16px;}

/* 머리 */
.top{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.top h1{font-size:24px; line-height:32px; font-weight:700; letter-spacing:-.4px;}
.top .sub{margin-top:4px; color:var(--muted);}
.top .sub.is-error{color:var(--critical);}
.top a{color:var(--ink-2); font-weight:600; text-decoration:none;}
.top a:hover{text-decoration:underline;}

/* 필터 한 줄 */
.filters{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.seg{display:flex; gap:2px; padding:3px; border-radius:10px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border);}
.seg button{height:32px; padding:0 14px; border:0; border-radius:8px; background:transparent; font-weight:600; color:var(--muted);}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface);}
.check{display:flex; align-items:center; gap:6px; color:var(--ink-2);}
.check input{width:16px; height:16px; accent-color:var(--accent);}
.spacer{flex:1;}
.ghost{height:36px; padding:0 14px; border:0; border-radius:10px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); font-weight:600; color:var(--ink-2);}
.ghost:hover{background:var(--surface-2);}

/* 카드 */
.card{background:var(--surface); border-radius:16px; box-shadow:inset 0 0 0 1px var(--border); padding:20px 24px 24px;}
.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px;}
.card-head h2{font-size:17px; line-height:24px; font-weight:700;}
.card-head p{margin-top:2px; color:var(--muted); font-size:13px;}
.toggle-table{flex:none; height:30px; padding:0 10px; border:0; border-radius:8px; background:var(--surface-2); font-size:12px; font-weight:600; color:var(--ink-2);}
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px;}
.is-stale{opacity:.55; transition:opacity .2s;}

/* 지표 타일 */
.kpis{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:16px;}
.tile{background:var(--surface); border-radius:16px; box-shadow:inset 0 0 0 1px var(--border); padding:18px 20px;}
.tile-label{color:var(--muted); font-size:13px;}
.tile-value{margin-top:6px; font-size:30px; line-height:36px; font-weight:700; letter-spacing:-.5px;}
.tile-value small{font-size:16px; font-weight:600; color:var(--muted); letter-spacing:0;}
.tile-note{margin-top:6px; color:var(--ink-2); font-size:13px;}

/* 범례 */
.legend{display:flex; gap:16px; flex-wrap:wrap; color:var(--ink-2); font-size:13px;}
.legend span{display:flex; align-items:center; gap:6px;}
.key{width:10px; height:10px; border-radius:50%; flex:none;}
.key-a{background:var(--series-a);}
.key-b{background:var(--series-b);}

/* 점 그래프 (A/B) */
.dots{display:grid; grid-template-columns:96px minmax(0, 1fr); row-gap:4px; margin-top:12px;}
.dots-label{display:flex; align-items:center; gap:6px; height:40px; font-weight:600; color:var(--ink-2); white-space:nowrap;}
.dots-track{position:relative; height:40px; border-bottom:1px solid var(--grid);}
.dots-axis{position:relative; height:24px; grid-column:2;}
.dots-axis span{position:absolute; top:4px; transform:translateX(-50%); color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap;}
.dots-grid{position:absolute; top:0; bottom:0; width:1px; background:var(--grid);}
.dot{
  position:absolute;
  top:50%;
  width:24px; height:24px;
  margin:-12px 0 0 -12px;
  border:0;
  padding:0;
  background:transparent;
}
.dot::before{
  content:"";
  position:absolute;
  left:6px; top:6px;
  width:12px; height:12px;
  border-radius:50%;
  background:var(--dot-color);
  box-shadow:0 0 0 2px var(--surface);
}
.dot:hover::before,.dot:focus-visible::before{transform:scale(1.25);}
.dot:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:50%;}
.mean{position:absolute; top:8px; bottom:8px; width:2px; margin-left:-1px; border-radius:2px; background:var(--ink);}
.mean-label{position:absolute; top:-2px; transform:translateX(6px); font-size:12px; color:var(--ink-2); white-space:nowrap;}

/* 비교표 */
.compare{width:100%; border-collapse:collapse; margin-top:20px; font-size:13px;}
.compare th,.compare td{padding:10px 12px; border-top:1px solid var(--grid); text-align:left;}
.compare thead th{border-top:0; color:var(--muted); font-weight:600;}
.compare td{font-variant-numeric:tabular-nums;}
.compare th[scope="row"]{color:var(--ink-2); font-weight:500;}
.compare .col-head{display:flex; align-items:center; gap:6px; color:var(--ink);}

/* 가로 막대 */
.bars{display:flex; flex-direction:column; gap:10px;}
.bar-row{display:grid; grid-template-columns:120px minmax(0, 1fr); align-items:center; gap:12px;}
.bar-label{color:var(--ink-2); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{position:relative; height:24px; display:flex; align-items:center;}
.bar{
  height:20px;
  min-width:2px;
  border-radius:0 4px 4px 0;
  background:var(--bar);
  border:0;
  padding:0;
}
.bar:hover,.bar:focus-visible{background:var(--bar-hover);}
.bar:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
.bar-value{margin-left:8px; color:var(--ink); font-size:13px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums;}
.bar-value small{font-weight:500; color:var(--muted);}
.bar-note{margin-top:14px; color:var(--muted); font-size:12px;}

/* 표 */
.table-wrap{overflow-x:auto; margin:0 -24px; padding:0 24px;}
table.data{width:100%; border-collapse:collapse; font-size:13px; white-space:nowrap;}
table.data th,table.data td{padding:10px 10px; border-top:1px solid var(--grid); text-align:left; vertical-align:top;}
table.data thead th{border-top:0; color:var(--muted); font-weight:600; font-size:12px;}
table.data td.num{text-align:right; font-variant-numeric:tabular-nums;}
table.data thead th.num{text-align:right;}
.srow{cursor:pointer;}
.srow:hover td{background:var(--surface-2);}
.srow[aria-expanded="true"] td{background:var(--surface-2);}
.pid{display:flex; align-items:center; gap:6px; font-weight:700;}
.pill{display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:6px; background:var(--surface-2); color:var(--ink-2); font-size:11px; font-weight:600;}
.pill.is-warn{color:var(--critical);}
.pill.is-good{color:var(--good);}
.status-dot{display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:var(--muted); vertical-align:1px;}
.status-dot.is-live{background:var(--good);}

/* 타임라인 */
.timeline-cell{padding:0 !important; background:var(--surface-2);}
.timeline{padding:16px 20px 20px; white-space:normal;}
.timeline-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; color:var(--muted); font-size:12px;}
.timeline ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column;}
.timeline li{display:grid; grid-template-columns:64px 120px minmax(0, 1fr); gap:12px; padding:5px 0; border-top:1px solid var(--grid); font-size:13px;}
.timeline li:first-child{border-top:0;}
.tl-time{color:var(--muted); font-variant-numeric:tabular-nums;}
.tl-screen{color:var(--muted);}
.tl-text b{font-weight:600;}
.tl-key{color:var(--ink);}
.danger{height:30px; padding:0 10px; border:0; border-radius:8px; background:transparent; box-shadow:inset 0 0 0 1px var(--border); color:var(--critical); font-size:12px; font-weight:600;}

.empty{padding:28px 0; color:var(--muted); text-align:center;}

/* 툴팁: 값이 먼저, 이름은 뒤에 */
.tip{
  position:fixed;
  z-index:10;
  min-width:120px;
  padding:8px 10px;
  border-radius:10px;
  background:var(--surface);
  box-shadow:0 6px 24px rgba(0,0,0,.16), 0 0 0 1px var(--border);
  font-size:12px;
  line-height:18px;
  pointer-events:none;
}
.tip strong{display:block; font-size:14px; line-height:20px; color:var(--ink);}
.tip span{display:block; color:var(--muted);}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2, minmax(0, 1fr));}
  .grid2{grid-template-columns:minmax(0, 1fr);}
}
@media (max-width:520px){
  .wrap{padding:20px 16px 48px;}
  .card{padding:16px;}
  .table-wrap{margin:0 -16px; padding:0 16px;}
  .bar-row{grid-template-columns:96px minmax(0, 1fr);}
  .dots{grid-template-columns:100px minmax(0, 1fr);}
  .dots-label{font-size:13px;}
  .timeline li{grid-template-columns:52px minmax(0, 1fr);}
  .tl-screen{display:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>알바몬 온보딩 UT 결과</h1>
      <p class="sub" id="conn">불러오는 중…</p>
    </div>
    <a href="index.html">프로토타입 열기 ↗</a>
  </header>

  <div class="filters" aria-label="필터">
    <div class="seg" id="f-group" role="group" aria-label="완료 화면 그룹">
      <button type="button" data-g="all" aria-pressed="true">전체</button>
      <button type="button" data-g="a" aria-pressed="false">A 코치마크</button>
      <button type="button" data-g="b" aria-pressed="false">B 하이라이트</button>
    </div>
    <label class="check"><input type="checkbox" id="f-test"> 연습 세션 포함</label>
    <span class="spacer"></span>
    <button class="ghost" type="button" id="csv-sessions">참가자 요약 CSV</button>
    <button class="ghost" type="button" id="csv-events">전체 기록 CSV</button>
  </div>

  <section class="kpis" id="kpis" aria-label="핵심 지표"></section>

  <section class="card" id="ab-card" aria-labelledby="ab-title">
    <div class="card-head">
      <div>
        <h2 id="ab-title">완료 화면 A/B 비교</h2>
        <p>완료 화면에 들어온 뒤 처음 무언가를 하기까지 걸린 시간 · 점 하나가 참가자 한 명</p>
      </div>
    </div>
    <div class="legend"><span><i class="key key-a"></i>A 코치마크</span><span><i class="key key-b"></i>B 하이라이트</span></div>
    <div id="ab-dots"></div>
    <table class="compare" id="ab-table"></table>
  </section>

  <div class="grid2">
    <section class="card" aria-labelledby="steps-title">
      <div class="card-head">
        <div>
          <h2 id="steps-title">단계별 머문 시간</h2>
          <p>참가자 평균 · 다시 들어온 시간까지 합산</p>
        </div>
        <button class="toggle-table" type="button" data-toggle="steps">표로 보기</button>
      </div>
      <div id="steps"></div>
    </section>
    <section class="card" aria-labelledby="funnel-title">
      <div class="card-head">
        <div>
          <h2 id="funnel-title">내 근처 위치 설정 흐름</h2>
          <p>STEP 0에서 위치 권한까지 남은 참가자 수</p>
        </div>
        <button class="toggle-table" type="button" data-toggle="funnel">표로 보기</button>
      </div>
      <div id="funnel"></div>
    </section>
  </div>

  <section class="card" aria-labelledby="sessions-title">
    <div class="card-head">
      <div>
        <h2 id="sessions-title">참가자별 기록</h2>
        <p>줄을 누르면 화면을 지나간 순서대로 모든 행동을 볼 수 있어요</p>
      </div>
    </div>
    <div class="table-wrap" id="sessions"></div>
  </section>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

  }
  function sec(ms){

  }

  }
  function pct(n, d){ return d ? Math.round(n / d * 100) + '%' : '–'; }
  function clock(ms){
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function dateText(ms){
    if (!ms) return '';
    var d = new Date(ms);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  /* ============ 세션 요약 ============ */
  function summarize(sid){
    var evs = eventsBySid[sid] || [];
    var doc = sessionDocs[sid] || {};
    var head = evs[0] || {};
    var first = function(type, pred){ for (var i = 0; i < evs.length; i++) if (evs[i].type === type && (!pred || pred(evs[i]))) return evs[i]; return null; };
    var all = function(type){ return evs.filter(function(e){ return e.type === type; }); };

      r.screenMs[from] = (r.screenMs[from] || 0) + (d(e).prevMs || 0);
    });
    r.backs = all('screen').filter(function(e){
      var a = SCREEN_ORDER[d(e).from], b = SCREEN_ORDER[d(e).name];
      return d(e).from !== 'home' && a != null && b != null && b < a;
    }).length;
    r.browserBack = all('browser_back').length;

    var choice = first('intro_choice');
    r.choice = choice ? d(choice).choice : null;
    r.mode = r.done.mode || r.choice;
    var consent = first('consent_agree', isIntro) || first('consent_later', isIntro) || first('consent_dismiss', isIntro);
    // 가장 먼저 일어난 동의 응답
    var answers = evs.filter(function(e){ return CONSENT[e.type] && d(e).context === 'intro'; });
    r.consent = answers.length ? answers[0].type : (consent ? consent.type : null);
    var geo = first('geo_result', isIntro);
    r.geo = geo ? d(geo).result : null;
    r.geoMs = geo ? d(geo).ms : null;
    r.permissionBefore = geo ? d(geo).permissionBefore : null;
    r.radius = r.done.radius;
    r.radiusChanges = all('radius_change').length;
    r.mapOpens = all('mapsheet_open').length;
    r.mapDrags = all('mapsheet_confirm').concat(all('mapsheet_close')).reduce(function(sum, e){ return sum + (d(e).drags || 0); }, 0);
    r.addrSearches = all('addr_search').length;
    r.addrPicks = all('addr_pick').length;
    r.regionToggles = all('region_toggle').length;
    r.limitHits = all('region_limit').length;

    var enter = first('home_enter');
    r.homeEntered = !!enter;
    r.homeGroup = enter ? d(enter).group : null;
    var fa = first('home_first_action');
    r.firstActionMs = fa ? d(fa).ms : null;
    r.firstAction = fa ? d(fa).target : null;
    var reach = first('home_reach_list');
    r.reachList = !!reach;
    r.reachAuto = reach ? !!d(reach).auto : false;
    var cd = first('coach_done');
    var cs = first('coach_skip');
    r.coach = cd ? 'done' : cs ? 'skip' + d(cs).step : (r.homeEntered && r.homeGroup === 'a' ? 'none' : null);
    r.homeTaps = all('home_tap').length;
    // 공고뷰 · 과제 종료
    var views = all('detail_open');
    r.detailViews = views.length;
    r.detailUnique = Object.keys(views.reduce(function(m, e){ m[d(e).title] = 1; return m; }, {})).length;
    r.detailMs = all('detail_close').reduce(function(sum, e){ return sum + (d(e).ms || 0); }, 0);
    r.applied = !!first('apply_tap');
    var te = first('task_end');
    r.taskEnd = te ? d(te).trigger : null;
    r.taskEndMs = te ? d(te).homeMs : null;
    r.errors = all('js_error').length;
    r.lastT = evs.length ? evs[evs.length - 1].t : 0;
    return r;
  }
  function isIntro(e){ return e.data && e.data.context === 'intro'; }

  function rows(){
    var ids = {};
    Object.keys(sessionDocs).forEach(function(k){ ids[k] = true; });
    Object.keys(eventsBySid).forEach(function(k){ ids[k] = true; });
    return Object.keys(ids).map(summarize).filter(function(r){
      if (!filter.test && r.test) return false;
      if (filter.group !== 'all' && r.group !== filter.group) return false;
      return true;
    }).sort(function(a, b){ return (a.participant - b.participant) || ((a.startedAt || 0) - (b.startedAt || 0)); });
  }

  /* ============ 그리기 ============ */
  var renderQueued = false;
  function render(){
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(function(){
      renderQueued = false;
      var list = rows();
      renderKpis(list);
      renderAB(list);
      renderSteps(list);
      renderFunnel(list);
      renderSessions(list);
    });
  }

  function tile(label, value, unit, note){
    return h('div', { class: 'tile' }, [
      h('p', { class: 'tile-label', text: label }),
      h('p', { class: 'tile-value' }, [value, unit ? h('small', { text: ' ' + unit }) : null]),
      note ? h('p', { class: 'tile-note', text: note }) : null
    ]);
  }
  function renderKpis(list){
    var box = $('kpis');
    box.textContent = '';
    var done = list.filter(function(r){ return r.completed; });
    var nearby = list.filter(function(r){ return r.choice === 'nearby'; });
    var agreed = list.filter(function(r){ return r.consent === 'consent_agree'; });
    var granted = agreed.filter(function(r){ return r.geo === 'granted'; });
    var avg = mean(done.map(function(r){ return r.onboardingMs; }));
    box.appendChild(tile('온보딩을 끝낸 참가자', String(done.length), '/ ' + list.length + '명', list.length ? '공고 보기까지 누른 비율 ' + pct(done.length, list.length) : '아직 기록이 없어요'));
    box.appendChild(tile('평균 온보딩 시간', avg == null ? '–' : sec(avg), null, '로그인 버튼 → 공고 보기'));
    // 버튼 순서별로 나눠 순서 효과를 본다.
    var byOrder = ['list-first', 'nearby-first'].map(function(o){
      var chose = list.filter(function(r){ return r.choice && r.order === o; });
      return ORDER_NAME[o] + ' ' + chose.filter(function(r){ return r.choice === 'nearby'; }).length + '/' + chose.length;
    }).join(' · ');
    box.appendChild(tile('STEP 0에서 내 근처 선택', String(nearby.length), '/ ' + list.filter(function(r){ return r.choice; }).length + '명', '버튼 순서별 ' + byOrder));
    box.appendChild(tile('동의 후 위치 권한 허용', String(granted.length), '/ ' + agreed.length + '명', '서비스 동의 ' + agreed.length + ' · 다음에 ' + nearby.filter(function(r){ return r.consent === 'consent_later'; }).length + ' · 거부 ' + agreed.filter(function(r){ return r.geo && r.geo !== 'granted'; }).length));
  }

  // A/B: 완료 화면 첫 행동까지 걸린 시간 점 그래프 + 비교표
  function renderAB(list){
    var dotsBox = $('ab-dots');
    var table = $('ab-table');
    dotsBox.textContent = '';
    table.textContent = '';
    var entered = list.filter(function(r){ return r.homeEntered; });
    var groups = ['a', 'b'].filter(function(g){ return filter.group === 'all' || filter.group === g; });
    if (!entered.length){
      dotsBox.appendChild(h('p', { class: 'empty', text: '완료 화면까지 간 참가자가 아직 없어요.' }));
      return;
    }
    var times = entered.map(function(r){ return r.firstActionMs; }).filter(function(v){ return v != null; });
    var max = niceMax(Math.max.apply(null, times.concat([5000])));
    var ticks = tickList(max);
    var grid = h('div', { class: 'dots' });
    groups.forEach(function(g){
      var members = entered.filter(function(r){ return r.homeGroup === g; });
      grid.appendChild(h('div', { class: 'dots-label' }, [h('i', { class: 'key key-' + g }), GROUP_NAME[g]]));
      var track = h('div', { class: 'dots-track' });
      ticks.forEach(function(t){ track.appendChild(h('span', { class: 'dots-grid', style: 'left:' + (t / max * 100) + '%' })); });
      var avg = mean(members.map(function(r){ return r.firstActionMs; }));
      if (avg != null){
        track.appendChild(h('span', { class: 'mean', style: 'left:' + (avg / max * 100) + '%' }));
        track.appendChild(h('span', { class: 'mean-label', style: 'left:' + (avg / max * 100) + '%', text: '평균 ' + sec(avg) }));
      }
      members.forEach(function(r){
        if (r.firstActionMs == null) return;
        var tipLines = [sec(r.firstActionMs), 'P' + r.participant + ' · 첫 행동 ' + actionName(r.firstAction)];
        track.appendChild(h('button', {
          class: 'dot',
          type: 'button',
          style: 'left:' + (r.firstActionMs / max * 100) + '%; --dot-color:var(--series-' + g + ')',
          'aria-label': 'P' + r.participant + ' ' + sec(r.firstActionMs),
          'data-tip': JSON.stringify(tipLines)
        }));
      });
      grid.appendChild(track);
    });
    var axis = h('div', { class: 'dots-axis' });
    ticks.forEach(function(t){ axis.appendChild(h('span', { style: 'left:' + (t / max * 100) + '%', text: Math.round(t / 1000) + '초' })); });
    grid.appendChild(axis);
    dotsBox.appendChild(grid);

    // 비교표
    var head = h('tr', null, [h('th', { scope: 'col', text: '지표' })]);
    groups.forEach(function(g){ head.appendChild(h('th', { scope: 'col' }, [h('span', { class: 'col-head' }, [h('i', { class: 'key key-' + g }), GROUP_NAME[g]])])); });
    table.appendChild(h('thead', null, [head]));
    var body = h('tbody');
    var metrics = [
      ['완료 화면을 본 참가자', function(m){ return m.length + '명'; }],
      ['첫 행동까지 (평균)', function(m){ return sec(mean(m.map(function(r){ return r.firstActionMs; }))); }],
      ['첫 행동 내용', function(m){ return m.map(function(r){ return 'P' + r.participant + ' ' + actionName(r.firstAction); }).join(' · ') || '–'; }],
      ['공고 목록까지 내려감', function(m){
        var reached = m.filter(function(r){ return r.reachList; });
        var auto = reached.filter(function(r){ return r.reachAuto; }).length;
        return reached.length + '/' + m.length + '명' + (auto ? ' (버튼으로 자동 이동 ' + auto + ')' : '');
      }],
      ['코치마크 끝까지 봄', function(m, g){
        if (g !== 'a') return '–';
        var doneN = m.filter(function(r){ return r.coach === 'done'; }).length;
        var skip = m.filter(function(r){ return r.coach && r.coach.indexOf('skip') === 0; }).length;
        return doneN + '/' + m.length + '명' + (skip ? ' · 건너뛰기 ' + skip : '');
      }],
      ['완료 화면에서 누른 횟수 (평균)', function(m){ var v = mean(m.map(function(r){ return r.homeTaps; })); return v == null ? '–' : (Math.round(v * 10) / 10) + '회'; }],
      ['공고뷰를 연 공고 수 (평균)', function(m){ var v = mean(m.map(function(r){ return r.detailUnique; })); return v == null ? '–' : (Math.round(v * 10) / 10) + '개'; }],
      ['과제 종료 방식', function(m){
        var apply = m.filter(function(r){ return r.taskEnd === 'apply'; }).length;
        var exit = m.filter(function(r){ return r.taskEnd && r.taskEnd !== 'apply'; });
        return '지원하기 ' + apply + ' · 다른 곳으로 이동 ' + exit.length + (exit.length ? ' (' + exit.map(function(r){ return actionName(r.taskEnd); }).join(', ') + ')' : '');
      }],
      ['과제 종료까지 (평균)', function(m){ return sec(mean(m.map(function(r){ return r.taskEndMs; }))); }]
    ];
    metrics.forEach(function(row){
      var tr = h('tr', null, [h('th', { scope: 'row', text: row[0] })]);
      groups.forEach(function(g){
        var members = entered.filter(function(r){ return r.homeGroup === g; });
        tr.appendChild(h('td', { text: row[1](members, g) }));
      });
      body.appendChild(tr);
    });
    table.appendChild(body);
  }
  function actionName(t){
    if (!t) return '없음';
    if (t === 'apply') return '지원하기';
    if (t.indexOf('home:') === 0) t = t.slice(5);
    if (t === 'scroll') return '스크롤';
    if (t === 'next') return '코치마크 다음';
    if (t === 'skip') return '코치마크 건너뛰기';
    var p = t.split(':');
    var kind = { qm: '퀵메뉴', chip: '칩', tab: '탭바', card: '공고 카드' }[p[0]];
    if (kind) return kind + ' ' + p[1];
    return { location: '상단 지역', menu: '메뉴', search: '검색창' }[t] || t;
  }
  function niceMax(v){
    var steps = [5000, 10000, 15000, 20000, 30000, 45000, 60000, 90000, 120000, 180000, 300000];
    for (var i = 0; i < steps.length; i++) if (v <= steps[i]) return steps[i];
    return Math.ceil(v / 60000) * 60000;
  }
  function tickList(max){
    var n = 5;
    var out = [];
    for (var i = 0; i <= n; i++) out.push(max / n * i);
    return out;
  }

  // 가로 막대 (단일 계열) — 값은 막대 끝에
  function barChart(items, unitFmt){
    var max = Math.max.apply(null, items.map(function(it){ return it.value || 0; }).concat([1]));
    var box = h('div', { class: 'bars' });
    items.forEach(function(it){
      var w = it.value ? Math.max(.6, it.value / max * 82) : 0;
      box.appendChild(h('div', { class: 'bar-row' }, [
        h('span', { class: 'bar-label', text: it.label, title: it.label }),
        h('div', { class: 'bar-track' }, [
          it.value ? h('button', { class: 'bar', type: 'button', style: 'width:' + w + '%', 'aria-label': it.label + ' ' + unitFmt(it.value), 'data-tip': JSON.stringify(it.tip) }) : null,
          h('span', { class: 'bar-value' }, [it.value == null ? '–' : unitFmt(it.value), it.sub ? h('small', { text: ' ' + it.sub }) : null])
        ])
      ]));
    });
    return box;
  }
  function simpleTable(headers, data){
    var t = h('table', { class: 'data' });
    t.appendChild(h('thead', null, [h('tr', null, headers.map(function(x, i){ return h('th', { class: i ? 'num' : null, scope: 'col', text: x }); }))]));
    t.appendChild(h('tbody', null, data.map(function(row){ return h('tr', null, row.map(function(x, i){ return h(i ? 'td' : 'th', { class: i ? 'num' : null, scope: i ? null : 'row', text: x }); })); })));
    return h('div', { class: 'table-wrap' }, [t]);
  }

  function renderSteps(list){
    var box = $('steps');
    box.textContent = '';
    if (!list.length){ box.appendChild(h('p', { class: 'empty', text: '아직 기록이 없어요.' })); return; }
    var items = STEP_ROWS.map(function(key){
      var vals = list.map(function(r){ return r.screenMs[key]; }).filter(function(v){ return v != null; });
      var avg = mean(vals);
      return {
        key: key,
        label: SCREEN_NAME[key],
        value: avg,
        sub: vals.length ? vals.length + '명' : '',
        min: vals.length ? Math.min.apply(null, vals) : null,
        max: vals.length ? Math.max.apply(null, vals) : null,
        n: vals.length,
        tip: [sec(avg), SCREEN_NAME[key] + ' · ' + vals.length + '명', vals.length ? '가장 짧게 ' + sec(Math.min.apply(null, vals)) + ' · 가장 길게 ' + sec(Math.max.apply(null, vals)) : '']
      };
    });
    if (tableView.steps){
      box.appendChild(simpleTable(['단계', '평균', '최소', '최대', '인원'], items.map(function(it){ return [it.label, sec(it.value), sec(it.min), sec(it.max), it.n + '명']; })));
    } else {
      box.appendChild(barChart(items, sec));
    }
    var backs = list.reduce(function(s, r){ return s + r.backs; }, 0);
    var swipes = list.reduce(function(s, r){ return s + r.browserBack; }, 0);
    box.appendChild(h('p', { class: 'bar-note', text: '이전 버튼으로 돌아간 횟수 ' + backs + '회 · 화면 밀어서 뒤로 가기 시도 ' + swipes + '회' }));
  }

  function renderFunnel(list){
    var box = $('funnel');
    box.textContent = '';
    if (!list.length){ box.appendChild(h('p', { class: 'empty', text: '아직 기록이 없어요.' })); return; }
    var chose = list.filter(function(r){ return r.choice; });
    var nearby = chose.filter(function(r){ return r.choice === 'nearby'; });
    var agreed = nearby.filter(function(r){ return r.consent === 'consent_agree'; });
    var granted = agreed.filter(function(r){ return r.geo === 'granted'; });
    var base = chose.length;
    var stages = [
      ['STEP 0에서 고름', chose],
      ['내 근처 선택하기', nearby],
      ['동의할게요', agreed],
      ['브라우저 위치 허용', granted]
    ];
    var items = stages.map(function(s){
      return { label: s[0], value: s[1].length, sub: pct(s[1].length, base), tip: [s[1].length + '명 (' + pct(s[1].length, base) + ')', s[0], s[1].map(function(r){ return 'P' + r.participant; }).join(' · ')] };
    });
    if (tableView.funnel){
      box.appendChild(simpleTable(['단계', '인원', '비율', '참가자'], items.map(function(it, i){ return [it.label, it.value + '명', it.sub, stages[i][1].map(function(r){ return 'P' + r.participant; }).join(', ') || '–']; })));
    } else {
      box.appendChild(barChart(items, function(v){ return v + '명'; }));
    }
    var later = nearby.filter(function(r){ return r.consent === 'consent_later'; }).length;
    var dismissed = nearby.filter(function(r){ return r.consent === 'consent_dismiss'; }).length;
    var denied = agreed.filter(function(r){ return r.geo && r.geo !== 'granted'; });
    var geoMs = mean(agreed.map(function(r){ return r.geoMs; }));
    box.appendChild(h('p', { class: 'bar-note', text: '다음에 ' + later + '명 · 바깥 눌러 닫음 ' + dismissed + '명 · 권한 거부·실패 ' + denied.length + '명 · 권한 응답까지 평균 ' + sec(geoMs) }));
  }

  /* ============ 참가자 표 + 타임라인 ============ */
  function consentText(r){
    if (r.choice !== 'nearby') return r.choice === 'list' ? '–' : '';
    var c = CONSENT[r.consent] || '응답 없음';
    return c + (r.consent === 'consent_agree' ? ' → ' + (GEO[r.geo] || '대기') : '');
  }
  function regionText(r){
    if (r.mode === 'nearby') return '내 근처 ' + (r.radius ? r.radius + 'km' : '');
    if (r.mode === 'list') return '지역 목록 ' + ((r.done.regions || []).length ? (r.done.regions || []).length + '곳' : '');
    return '–';
  }
  function coachText(r){
    if (!r.homeEntered) return '–';

    }
    var cols = ['참가자', '그룹', '버튼 순서', '시작', '지역 설정', '위치 동의 → 권한', '온보딩 시간', 'STEP 1', 'STEP 2', 'STEP 3', '이전', '완료 화면 첫 행동', '목록까지', '코치마크', '공고뷰', '과제 종료', '기록'];
    var numeric = { 6: 1, 7: 1, 8: 1, 9: 1, 10: 1, 14: 1, 16: 1 };
    var table = h('table', { class: 'data' });
    table.appendChild(h('thead', null, [h('tr', null, cols.map(function(c, i){ return h('th', { scope: 'col', class: numeric[i] ? 'num' : null, text: c }); }))]));
    var body = h('tbody');
    list.forEach(function(r){
      var open = !!expanded[r.sid];
      var step1 = (r.screenMs.step1 || 0) + (r.screenMs.nearby || 0);
      var tr = h('tr', { class: 'srow', tabindex: '0', 'aria-expanded': open ? 'true' : 'false', onclick: function(){ expanded[r.sid] = !open; render(); }, onkeydown: function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); expanded[r.sid] = !open; render(); } } }, [
        h('td', null, [h('span', { class: 'pid' }, ['P' + r.participant, r.test ? h('span', { class: 'pill', text: '연습' }) : null])]),
        h('td', null, [h('span', { class: 'pid' }, [h('i', { class: 'key key-' + r.group }), (r.group || '').toUpperCase()])]),
        h('td', { text: ORDER_NAME[r.order] || '–' }),
        h('td', null, [h('span', { class: 'status-dot' + (r.status === 'active' ? ' is-live' : '') }), dateText(r.startedAt)]),
        h('td', { text: regionText(r) }),
        h('td', { text: consentText(r) }),
        h('td', { class: 'num', text: r.completed ? sec(r.onboardingMs) : '미완료' }),
        h('td', { class: 'num', text: step1 ? sec(step1) : '–' }),
        h('td', { class: 'num', text: sec(r.screenMs.step2) }),
        h('td', { class: 'num', text: sec(r.screenMs.step3) }),
        h('td', { class: 'num', text: String(r.backs) }),
        h('td', { text: r.homeEntered ? (r.firstActionMs != null ? sec(r.firstActionMs) + ' · ' + actionName(r.firstAction) : '없음') : '–' }),
        h('td', { text: r.homeEntered ? (r.reachList ? (r.reachAuto ? '자동 이동' : '직접 스크롤') : '안 내려감') : '–' }),
        h('td', { text: coachText(r) }),
        h('td', { class: 'num', text: r.homeEntered ? r.detailUnique + '개' + (r.detailMs ? ' · ' + sec(r.detailMs) : '') : '–' }),
        h('td', { text: r.taskEnd ? actionName(r.taskEnd) + ' · ' + sec(r.taskEndMs) : (r.homeEntered ? '안 끝남' : '–') }),
        h('td', { class: 'num' }, [String(r.events.length), r.errors ? h('span', { class: 'pill is-warn', text: '오류 ' + r.errors }) : null])
      ]);
      body.appendChild(tr);
      if (open) body.appendChild(h('tr', null, [h('td', { class: 'timeline-cell', colspan: String(cols.length) }, [timeline(r)])]));
    });
    table.appendChild(body);
    box.appendChild(table);
  }

  function timeline(r){
    var wrap = h('div', { class: 'timeline' });
    var meta = [r.sid, r.standalone === true ? '홈 화면 앱' : r.standalone === false ? '브라우저' : '', r.loginMethod ? '로그인 ' + (LOGIN[r.loginMethod] || r.loginMethod) : ''].filter(Boolean).join(' · ');
    var del = h('button', { class: 'danger', type: 'button', text: '이 세션 기록 삭제', onclick: function(e){ e.stopPropagation(); removeSession(r); } });
    wrap.appendChild(h('div', { class: 'timeline-head' }, [h('span', { text: meta }), del]));
    var ol = h('ol');
    r.events.forEach(function(e){
      var text = describe(e);
      if (!text) return;
      ol.appendChild(h('li', null, [
        h('span', { class: 'tl-time', text: clock(e.t) }),
        h('span', { class: 'tl-screen', text: SCREEN_NAME[e.screen] || e.screen || '' }),
        h('span', { class: 'tl-text', text: text })
      ]));
    });
    wrap.appendChild(ol);
    return wrap;
  }

  // 이벤트를 사람이 읽는 문장으로
  function describe(e){
    var d = e.data || {};
    switch (e.type){
      case 'session_start': return '세션 시작 (위치 권한 ' + ({ prompt: '묻기', granted: '허용됨', denied: '거부됨' }[d.permission] || '확인 불가') + (d.order ? ' · 버튼 ' + ORDER_NAME[d.order] : '') + ')';
      case 'session_end': return '세션 종료';
      case 'page_load': return '페이지 새로 열림';
      case 'screen': return '→ ' + (SCREEN_NAME[d.name] || d.name) + ' (앞 화면 ' + sec(d.prevMs) + ')';
      case 'login': return '로그인: ' + (LOGIN[d.method] || d.method);
      case 'intro_choice': return (d.choice === 'nearby' ? "'내 근처 선택하기' 누름" : "'지역 선택하기' 누름") + (d.position ? ' (' + d.position + '번째 버튼)' : '');
      case 'consent_open': return '위치 동의 시트 열림' + (d.context === 'locate' ? ' (현재 위치 버튼)' : '');
      case 'consent_agree': return "'동의할게요' 누름";
      case 'consent_later': return "'다음에' 누름";
      case 'consent_dismiss': return '바깥을 눌러 동의 시트 닫음';
      case 'consent_terms': return '위치기반서비스 약관 보기 누름';
      case 'geo_request': return '브라우저 위치 권한 요청';
      case 'geo_result': return '위치 권한 결과: ' + (GEO[d.result] || d.result) + ' (' + sec(d.ms) + ')';
      case 'permission_change': return '위치 권한 상태 변경: ' + d.state;
      case 'region_toggle': return (d.on ? '지역 선택 ' : '지역 해제 ') + String(d.key || '').replace('|*', ' 전체').replace('|', ' ') + (d.via === 'search' ? ' (검색)' : d.via === 'chip' ? ' (칩)' : '');
      case 'region_limit': return '10곳 초과 토스트';
      case 'region_search': return '지역 검색 “' + d.q + '” (' + d.count + '건)';
      case 'region_reset': return '선택 지역 초기화';
      case 'remote_toggle': return '재택 포함 ' + (d.on ? '체크' : '해제');
      case 'region_done': return d.mode === 'nearby' ? '내 근처 설정 완료: ' + d.address + ' · ' + d.radius + 'km' : '지역 선택 완료 (' + (d.regions || []).length + '곳)';
      case 'radius_change': return '반경 ' + d.from + 'km → ' + d.km + 'km';
      case 'mapsheet_open': return '알바 탐색위치 시트 열림 (' + ({ map: '지도 누름', title: '주소 누름', consent_later: '다음에 이후' }[d.via] || d.via) + ')';
      case 'mapsheet_confirm': return '탐색위치 확인: ' + d.address + ' (' + ({ map: '지도 이동', search: '주소 검색', gps: '현재 위치', default: '기본 위치' }[d.source] || d.source) + ', 지도 이동 ' + d.drags + '회)';
      case 'mapsheet_close': return '탐색위치 시트 닫음 (' + (d.via === 'dim' ? '바깥' : 'X') + ')';
      case 'map_drag': return null;
      case 'map_zoom': return null;
      case 'locate_tap': return '현재 위치 버튼 누름';
      case 'addr_open': return '주소검색 열림';
      case 'addr_search': return '주소 검색 “' + d.q + '” (' + d.count + '건)';
      case 'addr_pick': return '검색 결과 선택: ' + (d.road || d.jibun);
      case 'addr_close': return '주소검색 닫음';
      case 'period_pick': return '근무기간: ' + (PERIOD[d.period] || d.period) + (d.same ? ' (같은 항목 다시 누름)' : '');
      case 'job_toggle': return (d.on ? '하는 일 선택 ' : '하는 일 해제 ') + (JOB_NAME[d.id] || d.id);
      case 'onboarding_complete': return "'공고 보기' 누름 — 온보딩 완료";
      case 'home_enter': return '완료 화면 진입 (' + (GROUP_NAME[d.group] || d.group) + ' · ' + d.location + ')';
      case 'coach_open': return '코치마크 표시';
      case 'coach_next': return '코치마크 ' + d.step + '단계 다음 (' + sec(d.ms) + ')';
      case 'coach_skip': return '코치마크 ' + d.step + '단계에서 건너뛰기 (' + sec(d.ms) + ')';
      case 'coach_done': return "코치마크 '홈에서 알바찾기' (" + sec(d.ms) + ')';
      case 'home_first_action': return '완료 화면 첫 행동: ' + actionName(d.target) + ' (' + sec(d.ms) + ')';
      case 'home_scroll_first': return '처음 스크롤 (' + sec(d.ms) + ')';
      case 'home_reach_list': return '공고 목록까지 내려감' + (d.auto ? ' (자동 이동)' : '') + ' (' + sec(d.ms) + ')';
      case 'home_tap': return '누름: ' + actionName(d.target) + (d.title ? ' “' + d.title + '”' : '');
      case 'home_leave': return '완료 화면 나감 (' + sec(d.ms) + ')';
      case 'browser_back': return '화면 밀어서 뒤로 가기 시도';
      case 'detail_open': return '공고뷰 열림: “' + d.title + '” (' + d.index + '번째 공고)';
      case 'detail_close': return '공고뷰 닫음 (' + sec(d.ms) + ' · ' + d.scrollPct + '%까지 스크롤)';
      case 'detail_tap': return '공고뷰에서 누름: ' + ({ capture: '캡처', folder: '스크랩함', share: '공유', copy: '주소 복사', map: '근무지 지도 보기', scrap: '스크랩' }[d.target] || d.target);
      case 'apply_tap': return "'지원하기' 누름 (공고뷰 " + sec(d.ms) + ')';
      case 'task_end': return '과제 종료 팝업: ' + actionName(d.trigger) + (d.homeMs != null ? ' (완료 화면 진입 후 ' + sec(d.homeMs) + ')' : '');
      case 'task_end_close': return '과제 종료 팝업 확인';
      case 'app_hidden': return '앱 화면을 벗어남';
      case 'app_visible': return '앱 화면으로 돌아옴';
      case 'js_error': return '오류: ' + d.message;
      case 'map_sdk_error': return '지도 불러오기 실패';
      default: return e.type;
    }
  }

  function removeSession(r){
    if (!window.confirm('P' + r.participant + ' 세션(' + r.sid + ')의 기록 ' + r.events.length + '건을 지울까요? 되돌릴 수 없어요.')) return;
    var refs = [db.collection(COL_SESSIONS).doc(r.sid)];
    db.collection(COL_EVENTS).where('sid', '==', r.sid).get().then(function(snap){
      snap.forEach(function(doc){ refs.push(doc.ref); });
      var chunks = [];
      for (var i = 0; i < refs.length; i += 400) chunks.push(refs.slice(i, i + 400));
      return Promise.all(chunks.map(function(chunk){
        var b = db.batch();
        chunk.forEach(function(ref){ b.delete(ref); });
        return b.commit();
      }));
    }).catch(function(err){ window.alert('삭제하지 못했어요: ' + (err.code || err.message)); });
  }

  /* ============ CSV ============ */
  function csvCell(v){
    if (v == null) return '';
    var s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function download(name, lines){
    var blob = new Blob(['﻿' + lines.map(function(row){ return row.map(csvCell).join(','); }).join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  $('csv-sessions').addEventListener('click', function(){
    var head = ['participant', 'group', 'button_order', 'test', 'sid', 'started', 'login', 'choice', 'mode', 'consent', 'geo', 'geo_ms', 'radius_km', 'regions', 'remote', 'period', 'jobs', 'onboarding_ms', 'login_ms', 'intro_ms', 'step1_ms', 'nearby_ms', 'step2_ms', 'step3_ms', 'backs', 'browser_back', 'region_toggles', 'limit_hits', 'radius_changes', 'map_opens', 'map_drags', 'addr_searches', 'addr_picks', 'home_first_action_ms', 'home_first_action', 'reach_list', 'reach_auto', 'coach', 'home_taps', 'detail_unique', 'detail_ms', 'task_end', 'task_end_ms', 'events'];
    var lines = [head].concat(rows().map(function(r){
      return [r.participant, r.group, r.order, r.test, r.sid, r.startedAt ? new Date(r.startedAt).toISOString() : '', r.loginMethod, r.choice, r.mode, CONSENT[r.consent] || '', r.geo, r.geoMs, r.radius, (r.done.regions || []).join(' / '), r.done.remote, PERIOD[r.done.period] || '', (r.done.jobs || []).map(function(id){ return JOB_NAME[id] || id; }).join(' / '), r.onboardingMs,
        r.screenMs.login, r.screenMs.intro, r.screenMs.step1, r.screenMs.nearby, r.screenMs.step2, r.screenMs.step3, r.backs, r.browserBack, r.regionToggles, r.limitHits, r.radiusChanges, r.mapOpens, r.mapDrags, r.addrSearches, r.addrPicks, r.firstActionMs, r.firstAction, r.reachList, r.reachAuto, r.coach, r.homeTaps, r.detailUnique, r.detailMs, r.taskEnd, r.taskEndMs, r.events.length];
    }));
    download('onboarding-ut-participants.csv', lines);
  });
  $('csv-events').addEventListener('click', function(){
    var lines = [['participant', 'group', 'test', 'sid', 'seq', 't_ms', 'time', 'screen', 'type', 'description', 'data']];
    rows().forEach(function(r){
      r.events.forEach(function(e){
        lines.push([r.participant, r.group, r.test, r.sid, e.seq, e.t, clock(e.t), e.screen, e.type, describe(e) || '', e.data]);
      });
    });
    download('onboarding-ut-events.csv', lines);
  });

  /* ============ 필터 · 표 보기 ============ */
  $('f-group').addEventListener('click', function(e){
    var b = e.target.closest('[data-g]');
    if (!b) return;
    filter.group = b.dataset.g;
    $('f-group').querySelectorAll('[data-g]').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
    render();
  });
  $('f-test').addEventListener('change', function(){ filter.test = this.checked; render(); });
  document.querySelectorAll('[data-toggle]').forEach(function(b){
    b.addEventListener('click', function(){
      var k = b.dataset.toggle;
      tableView[k] = !tableView[k];
      b.textContent = tableView[k] ? '그래프로 보기' : '표로 보기';
      render();
    });
  });

  /* ============ 툴팁 ============ */
  var tip = $('tip');
  function showTip(target, x, y){
    var lines;
    try { lines = JSON.parse(target.getAttribute('data-tip')); } catch (e) { return; }
    tip.textContent = '';
    lines.filter(Boolean).forEach(function(line, i){ tip.appendChild(h(i ? 'span' : 'strong', { text: line })); });
    tip.hidden = false;
    var r = tip.getBoundingClientRect();
    var left = Math.min(window.innerWidth - r.width - 8, x + 14);
    var top = y - r.height - 12 < 8 ? y + 16 : y - r.height - 12;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = top + 'px';
  }
  document.addEventListener('pointermove', function(e){
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (t) showTip(t, e.clientX, e.clientY);
    else tip.hidden = true;
  });
  document.addEventListener('focusin', function(e){
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (!t){ tip.hidden = true; return; }
    var r = t.getBoundingClientRect();
    showTip(t, r.left + r.width / 2, r.top);
  });

  // 로컬 확인용: 같은 브라우저에서 프로토타입을 돌렸다면 아직 전송되지 않은 대기열(obut:queue)로 그려 본다.
  // 콘솔에서 dashboardFromLocalQueue() 실행
  window.dashboardFromLocalQueue = function(){
    var items = [];
    try { items = JSON.parse(localStorage.getItem('obut:queue')) || []; } catch (e) {}
    items.forEach(function(it){
      if (it.col === COL_SESSIONS) sessionDocs[it.id] = Object.assign(sessionDocs[it.id] || {}, it.data);
      if (it.col === COL_EVENTS){
        var list = eventsBySid[it.data.sid] = eventsBySid[it.data.sid] || [];
        if (!list.some(function(e){ return e.seq === it.data.seq; })) list.push(it.data);
      }
    });
    Object.keys(eventsBySid).forEach(function(k){ eventsBySid[k].sort(function(a, b){ return a.seq - b.seq; }); });
    setConn('이 브라우저의 전송 대기 기록 ' + items.length + '건으로 그린 화면');
    render();
    return items.length;
  };

  /* ============ Firebase 실시간 구독 ============ */
  var db = null;
  function setConn(text, error){
    conn.textContent = text;
    conn.classList.toggle('is-error', !!error);
  }
  function updated(){
    if (!loaded.s || !loaded.e) return;
    var n = Object.keys(eventsBySid).reduce(function(s, k){ return s + eventsBySid[k].length; }, 0);
    setConn('실시간 연결됨 · 세션 ' + Object.keys(sessionDocs).length + '개 · 기록 ' + n + '건 · ' + dateText(Date.now()) + ' 갱신');
    document.querySelectorAll('.card, .kpis').forEach(function(c){ c.classList.remove('is-stale'); });
  }
  function onError(err){
    var code = err && (err.code || err.message);
    setConn(code === 'permission-denied'
      ? 'Firestore 보안 규칙이 읽기를 막고 있어요 (onboarding_ut_sessions · onboarding_ut_events 컬렉션 허용 필요)'
      : '불러오지 못했어요: ' + code, true);
  }
  try {
    firebase.initializeApp(FIREBASE);
    db = firebase.firestore();
    db.collection(COL_SESSIONS).onSnapshot(function(snap){
      sessionDocs = {};
      snap.forEach(function(doc){ sessionDocs[doc.id] = doc.data(); });
      loaded.s = true;
      updated();
      render();
    }, onError);
    db.collection(COL_EVENTS).onSnapshot(function(snap){
      eventsBySid = {};
      snap.forEach(function(doc){
        var e = doc.data();
        (eventsBySid[e.sid] = eventsBySid[e.sid] || []).push(e);
      });
      Object.keys(eventsBySid).forEach(function(k){ eventsBySid[k].sort(function(a, b){ return a.seq - b.seq; }); });
      loaded.e = true;
      updated();
      render();
    }, onError);
  } catch (err) { onError(err); }
  render();
})();
</script>
</body>
</html>
